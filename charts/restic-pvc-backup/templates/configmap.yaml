apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "restic-pvc-backup.configName" . }}
  labels:
    {{ include "restic-pvc-backup.labels" . | nindent 4 }}
data:
  sources.txt: |
{{ range $target := .Values.backup.targets }}
  {{ if $target.include }}
    {{ range $path := $target.include }}
    /backup/{{ $target.name }}/{{ trimPrefix "/" $path }}
    {{ end }}
  {{ else }}
    /backup/{{ $target.name }}
  {{ end }}
{{ end }}
  excludes.txt: |
{{ range $target := .Values.backup.targets }}
  {{ range $path := ($target.exclude | default (list)) }}
    /backup/{{ $target.name }}/{{ trimPrefix "/" $path }}
  {{ end }}
{{ end }}
  backup.sh: |
    #!/bin/sh
    set -eu

    ts() { date -u '+%Y-%m-%dT%H:%M:%SZ'; }
    log() { printf '%s %s\n' "$(ts)" "$*"; }
    restic_cmd() {
      if [ -n "${RESTIC_RETRY_LOCK:-}" ]; then
        restic --retry-lock "$RESTIC_RETRY_LOCK" "$@"
      else
        restic "$@"
      fi
    }

    export RESTIC_HOST="${RESTIC_HOST:-{{ default (include "restic-pvc-backup.fullname" .) .Values.backup.host }}}"
    export RESTIC_CACHE_DIR="${RESTIC_CACHE_DIR:-/cache}"

    if [ ! -s /config/sources.txt ]; then
      log "ERROR: no backup targets/sources configured"
      exit 2
    fi

    if [ "{{ .Values.repository.autoInitialize }}" = "true" ]; then
      set +e
      restic_cmd snapshots >/dev/null 2>&1
      repo_rc=$?
      set -e
      case "$repo_rc" in
        0) ;;
        10)
          log "repository does not exist; initializing"
          restic_cmd init
          ;;
        *)
          log "ERROR: repository probe failed with exit code ${repo_rc}"
          exit "$repo_rc"
          ;;
      esac
    fi

    backup_rc=0
    retention_rc=0
    check_rc=0

    log "starting restic backup"
    set +e
    restic_cmd backup \
      --json \
      --host "$RESTIC_HOST" \
      --files-from-verbatim=/config/sources.txt \
      --exclude-file=/config/excludes.txt \
{{ range .Values.backup.tags }}
      --tag {{ . | quote }} \
{{ end }}
{{ range .Values.backup.extraArgs }}
      {{ . }} \
{{ end }}
      > /tmp/restic-backup.jsonl
    backup_rc=$?
    set -e
    cat /tmp/restic-backup.jsonl

    if [ "$backup_rc" -eq 0 ]; then
      log "backup completed successfully"
{{ if .Values.retention.enabled }}
      log "starting retention cleanup"
      set +e
      restic_cmd forget \
        --json \
        --host "$RESTIC_HOST" \
        --group-by {{ .Values.retention.groupBy | quote }} \
{{ if .Values.backup.tags }}
        --tag {{ join "," .Values.backup.tags | quote }} \
{{ end }}
{{ if .Values.retention.keepLast }}
        --keep-last {{ .Values.retention.keepLast }} \
{{ end }}
{{ if .Values.retention.keepHourly }}
        --keep-hourly {{ .Values.retention.keepHourly }} \
{{ end }}
{{ if .Values.retention.keepDaily }}
        --keep-daily {{ .Values.retention.keepDaily }} \
{{ end }}
{{ if .Values.retention.keepWeekly }}
        --keep-weekly {{ .Values.retention.keepWeekly }} \
{{ end }}
{{ if .Values.retention.keepMonthly }}
        --keep-monthly {{ .Values.retention.keepMonthly }} \
{{ end }}
{{ if .Values.retention.keepYearly }}
        --keep-yearly {{ .Values.retention.keepYearly }} \
{{ end }}
{{ if .Values.retention.keepWithin }}
        --keep-within {{ .Values.retention.keepWithin | quote }} \
{{ end }}
{{ if .Values.retention.keepWithinHourly }}
        --keep-within-hourly {{ .Values.retention.keepWithinHourly | quote }} \
{{ end }}
{{ if .Values.retention.keepWithinDaily }}
        --keep-within-daily {{ .Values.retention.keepWithinDaily | quote }} \
{{ end }}
{{ if .Values.retention.keepWithinWeekly }}
        --keep-within-weekly {{ .Values.retention.keepWithinWeekly | quote }} \
{{ end }}
{{ if .Values.retention.keepWithinMonthly }}
        --keep-within-monthly {{ .Values.retention.keepWithinMonthly | quote }} \
{{ end }}
{{ if .Values.retention.keepWithinYearly }}
        --keep-within-yearly {{ .Values.retention.keepWithinYearly | quote }} \
{{ end }}
{{ range .Values.retention.keepTags }}
        --keep-tag {{ . | quote }} \
{{ end }}
{{ if .Values.retention.prune }}
        --prune \
{{ end }}
{{ range .Values.retention.extraArgs }}
        {{ . }} \
{{ end }}
        > /tmp/restic-forget.jsonl
      retention_rc=$?
      set -e
      cat /tmp/restic-forget.jsonl
      if [ "$retention_rc" -eq 0 ]; then
        log "retention cleanup completed successfully"
      else
        log "ERROR: retention cleanup failed with exit code ${retention_rc}"
      fi
{{ end }}
    else
      log "ERROR: backup failed with exit code ${backup_rc}; retention cleanup skipped"
    fi

{{ if .Values.check.enabled }}
    log "starting repository structure check"
    set +e
    restic_cmd check \
      --json \
{{ if .Values.check.readData }}
      --read-data \
{{ end }}
{{ if .Values.check.readDataSubset }}
      --read-data-subset {{ .Values.check.readDataSubset | quote }} \
{{ end }}
{{ range .Values.check.extraArgs }}
      {{ . }} \
{{ end }}
      > /tmp/restic-check.jsonl
    check_rc=$?
    set -e
    cat /tmp/restic-check.jsonl
    if [ "$check_rc" -eq 0 ]; then
      log "repository structure check completed successfully"
    else
      log "ERROR: repository structure check failed with exit code ${check_rc}"
    fi
{{ end }}

    if [ "$backup_rc" -ne 0 ]; then exit "$backup_rc"; fi
    if [ "$retention_rc" -ne 0 ]; then exit "$retention_rc"; fi
    if [ "$check_rc" -ne 0 ]; then exit "$check_rc"; fi

    log "backup cycle completed successfully"

  integrity-check.sh: |
    #!/bin/sh
    set -eu

    ts() { date -u '+%Y-%m-%dT%H:%M:%SZ'; }
    log() { printf '%s %s\n' "$(ts)" "$*"; }
    restic_cmd() {
      if [ -n "${RESTIC_RETRY_LOCK:-}" ]; then
        restic --retry-lock "$RESTIC_RETRY_LOCK" "$@"
      else
        restic "$@"
      fi
    }

    export RESTIC_CACHE_DIR="${RESTIC_CACHE_DIR:-/cache}"
    mode={{ .Values.integrityCheck.mode | quote }}

    log "starting periodic Restic integrity verification (mode=${mode})"
    set +e
    case "$mode" in
      metadata)
        restic_cmd check \
          --json \
{{ if .Values.integrityCheck.withCache }}
          --with-cache \
{{ end }}
{{ range .Values.integrityCheck.extraArgs }}
          {{ . }} \
{{ end }}
          > /tmp/restic-integrity-check.jsonl
        ;;
      subset)
        if [ -z {{ .Values.integrityCheck.readDataSubset | quote }} ]; then
          log "ERROR: integrityCheck.readDataSubset must be set when mode=subset"
          exit 2
        fi
        restic_cmd check \
          --json \
          --read-data-subset {{ .Values.integrityCheck.readDataSubset | quote }} \
{{ if .Values.integrityCheck.withCache }}
          --with-cache \
{{ end }}
{{ range .Values.integrityCheck.extraArgs }}
          {{ . }} \
{{ end }}
          > /tmp/restic-integrity-check.jsonl
        ;;
      full)
        restic_cmd check \
          --json \
          --read-data \
{{ if .Values.integrityCheck.withCache }}
          --with-cache \
{{ end }}
{{ range .Values.integrityCheck.extraArgs }}
          {{ . }} \
{{ end }}
          > /tmp/restic-integrity-check.jsonl
        ;;
      *)
        log "ERROR: invalid integrityCheck.mode=${mode}; expected metadata, subset, or full"
        exit 2
        ;;
    esac
    check_rc=$?
    set -e

    cat /tmp/restic-integrity-check.jsonl
    if [ "$check_rc" -ne 0 ]; then
      log "ERROR: periodic integrity verification failed with exit code ${check_rc}"
      exit "$check_rc"
    fi

    log "periodic integrity verification completed successfully"
