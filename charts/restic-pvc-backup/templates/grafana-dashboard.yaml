{{ if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "restic-pvc-backup.dashboardConfigName" . }}
  labels:
    {{ include "restic-pvc-backup.labels" . | nindent 4 }}
    {{ with .Values.grafanaDashboard.labels }}
    {{ toYaml . | nindent 4 }}
    {{ end }}
  {{ with .Values.grafanaDashboard.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{ end }}
data:
  restic-pvc-backup.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Policy",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "**Backup:** `{{ .Values.backup.schedule }}` \u00b7 **Integrity:** `{{ .Values.integrityCheck.schedule }}` (`{{ .Values.integrityCheck.mode }}`, subset `{{ .Values.integrityCheck.readDataSubset | default "n/a" }}`) \u00b7 **Retention:** last `{{ .Values.retention.keepLast | default "-" }}`, hourly `{{ .Values.retention.keepHourly | default "-" }}`, daily `{{ .Values.retention.keepDaily | default "-" }}`, weekly `{{ .Values.retention.keepWeekly | default "-" }}`, monthly `{{ .Values.retention.keepMonthly | default "-" }}`, yearly `{{ .Values.retention.keepYearly | default "-" }}` \u00b7 **Prune after backup:** `{{ .Values.retention.prune }}`"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Last snapshot age",
          "description": "Age of the newest Restic snapshot reported by restic-exporter.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 86400
                  },
                  {
                    "color": "red",
                    "value": {{ .Values.prometheusRule.staleBackupSeconds }}
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "time() - max(restic_backup_timestamp{job=\"{{ include "restic-pvc-backup.fullname" . }}\"})",
              "instant": false,
              "range": true,
              "refId": "A"
            }
          ]
        },
