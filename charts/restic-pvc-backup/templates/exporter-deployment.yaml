{{ if .Values.exporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restic-pvc-backup.exporterName" . }}
  labels:
    {{ include "restic-pvc-backup.labels" . | nindent 4 }}
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{ include "restic-pvc-backup.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        {{ include "restic-pvc-backup.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: exporter
        {{ with .Values.exporter.podLabels }}
        {{ toYaml . | nindent 8 }}
        {{ end }}
      {{ with .Values.exporter.podAnnotations }}
      annotations:
        {{ toYaml . | nindent 8 }}
      {{ end }}
    spec:
      {{ with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      containers:
        - name: exporter
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "restic-pvc-backup.secretName" . }}
          env:
            - name: REFRESH_INTERVAL
              value: {{ .Values.exporter.refreshInterval | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.exporter.logLevel | quote }}
            - name: NO_CHECK
              value: {{ ternary "True" "False" .Values.exporter.noCheck | quote }}
            - name: NO_GLOBAL_STATS
              value: {{ ternary "True" "False" .Values.exporter.noGlobalStats | quote }}
            - name: NO_LOCKS
              value: {{ ternary "True" "False" .Values.exporter.noLocks | quote }}
            - name: INCLUDE_PATHS
              value: {{ ternary "True" "False" .Values.exporter.includePaths | quote }}
            - name: LISTEN_PORT
              value: {{ .Values.exporter.service.port | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{ toYaml .Values.exporter.resources | nindent 12 }}
{{ if .Values.exporter.cache.enabled }}
          volumeMounts:
            - name: exporter-cache
              mountPath: /root/.cache/restic
{{ end }}
{{ if .Values.exporter.cache.enabled }}
      volumes:
        - name: exporter-cache
          emptyDir:
            {{ toYaml .Values.exporter.cache.emptyDir | nindent 12 }}
{{ end }}
      {{ with .Values.exporter.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      {{ with .Values.exporter.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      {{ with .Values.exporter.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{ end }}
{{ end }}
