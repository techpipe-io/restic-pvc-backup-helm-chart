{{ if and .Values.exporter.enabled .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "restic-pvc-backup.fullname" . }}
  labels:
    {{ include "restic-pvc-backup.labels" . | nindent 4 }}
    {{ with .Values.serviceMonitor.additionalLabels }}
    {{ toYaml . | nindent 4 }}
    {{ end }}
spec:
  jobLabel: restic-backup-instance
  selector:
    matchLabels:
      {{ include "restic-pvc-backup.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: exporter
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      path: /metrics
      {{ with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      {{ with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{ toYaml . | nindent 8 }}
      {{ end }}
{{ end }}
