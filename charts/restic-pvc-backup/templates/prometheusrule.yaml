{{ if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "restic-pvc-backup.fullname" . }}
  labels:
    {{ include "restic-pvc-backup.labels" . | nindent 4 }}
    {{ with .Values.prometheusRule.additionalLabels }}
    {{ toYaml . | nindent 4 }}
    {{ end }}
spec:
  groups:
    - name: {{ include "restic-pvc-backup.fullname" . }}.cronjobs
      rules:
{{ if .Values.prometheusRule.rules.backupLatestRunFailed }}
        - alert: ResticPVCBackupLatestRunFailed
          expr: |
            (
              (
                kube_cronjob_status_last_schedule_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}}
                > on(namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}}
              )
              or
              (
                kube_cronjob_status_last_schedule_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}}
                unless on(namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}}
              )
            )
            and on(namespace, cronjob)
            (kube_cronjob_status_active{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}} == 0)
          for: {{ .Values.prometheusRule.latestRunFailureFor }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Latest Restic PVC backup run did not succeed"
            description: "The latest scheduled execution of {{ include "restic-pvc-backup.backupCronJobName" . }} has no matching successful completion."
{{ end }}
{{ if .Values.prometheusRule.rules.backupStale }}
        - alert: ResticPVCBackupStale
          expr: |
            (
              time() - kube_cronjob_status_last_successful_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}}
              > {{ .Values.prometheusRule.staleBackupSeconds }}
            )
            or
            (
              (time() - kube_cronjob_created{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}} > {{ .Values.prometheusRule.staleBackupSeconds }})
              unless on(namespace, cronjob)
              kube_cronjob_status_last_successful_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}}
            )
          for: 10m
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Restic PVC backup is stale"
            description: "No successful backup CronJob execution has been observed within the configured stale threshold."
{{ end }}
{{ if .Values.prometheusRule.rules.backupRunningTooLong }}
        - alert: ResticPVCBackupRunningTooLong
          expr: |
            kube_cronjob_status_active{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}} > 0
            and on(namespace, cronjob)
            (time() - kube_cronjob_status_last_schedule_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.backupCronJobName" . | quote }}} > {{ .Values.prometheusRule.runningTooLongSeconds }})
          for: 5m
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Restic PVC backup is running too long"
            description: "The backup CronJob has remained active longer than the configured threshold."
{{ end }}
{{ if and .Values.integrityCheck.enabled .Values.prometheusRule.rules.integrityLatestRunFailed }}
        - alert: ResticPVCIntegrityLatestRunFailed
          expr: |
            (
              (
                kube_cronjob_status_last_schedule_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}}
                > on(namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}}
              )
              or
              (
                kube_cronjob_status_last_schedule_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}}
                unless on(namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}}
              )
            )
            and on(namespace, cronjob)
            (kube_cronjob_status_active{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}} == 0)
          for: {{ .Values.prometheusRule.latestRunFailureFor }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Latest Restic integrity verification did not succeed"
            description: "The latest scheduled execution of {{ include "restic-pvc-backup.integrityName" . }} has no matching successful completion."
{{ end }}
{{ if and .Values.integrityCheck.enabled .Values.prometheusRule.rules.integrityStale }}
        - alert: ResticPVCIntegrityCheckStale
          expr: |
            (
              time() - kube_cronjob_status_last_successful_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}}
              > {{ .Values.prometheusRule.staleIntegritySeconds }}
            )
            or
            (
              (time() - kube_cronjob_created{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}} > {{ .Values.prometheusRule.staleIntegritySeconds }})
              unless on(namespace, cronjob)
              kube_cronjob_status_last_successful_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}}
            )
          for: 10m
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Restic integrity verification is stale"
            description: "No successful periodic integrity CronJob execution has been observed within the configured stale threshold."
{{ end }}
{{ if and .Values.integrityCheck.enabled .Values.prometheusRule.rules.integrityRunningTooLong }}
        - alert: ResticPVCIntegrityCheckRunningTooLong
          expr: |
            kube_cronjob_status_active{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}} > 0
            and on(namespace, cronjob)
            (time() - kube_cronjob_status_last_schedule_time{namespace={{ .Release.Namespace | quote }},cronjob={{ include "restic-pvc-backup.integrityName" . | quote }}} > {{ .Values.prometheusRule.runningTooLongSeconds }})
          for: 5m
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Restic integrity verification is running too long"
            description: "The integrity CronJob has remained active longer than the configured threshold."
{{ end }}

{{ if and .Values.exporter.enabled .Values.serviceMonitor.enabled }}
    - name: {{ include "restic-pvc-backup.fullname" . }}.repository
      rules:
{{ if .Values.prometheusRule.rules.exporterDown }}
        - alert: ResticExporterDown
          expr: |
            absent(up{job={{ include "restic-pvc-backup.fullname" . | quote }}})
            or
            (up{job={{ include "restic-pvc-backup.fullname" . | quote }}} == 0)
          for: {{ .Values.prometheusRule.exporterDownFor }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Restic exporter is unavailable"
            description: "Prometheus cannot scrape the Restic repository exporter for this backup release."
{{ end }}
{{ if .Values.prometheusRule.rules.repositoryLocked }}
        - alert: ResticRepositoryLockedTooLong
          expr: restic_locks_total{job={{ include "restic-pvc-backup.fullname" . | quote }}} > 0
          for: {{ .Values.prometheusRule.repositoryLockFor }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Restic repository has been locked for too long"
            description: "The exporter has continuously observed one or more Restic repository locks."
{{ end }}
{{ if and (not .Values.exporter.noCheck) .Values.prometheusRule.rules.repositoryCheckFailed }}
        - alert: ResticRepositoryExporterCheckFailed
          expr: restic_check_success{job={{ include "restic-pvc-backup.fullname" . | quote }}} == 0
          for: 10m
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: "Exporter-driven Restic repository check failed"
            description: "restic-exporter reports a failed repository check."
{{ end }}
{{ end }}
{{ with .Values.prometheusRule.additionalRules }}
    - name: {{ include "restic-pvc-backup.fullname" $ }}.additional
      rules:
        {{ toYaml . | nindent 8 }}
{{ end }}
{{ end }}
