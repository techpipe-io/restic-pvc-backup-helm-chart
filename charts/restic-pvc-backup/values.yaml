image:
  repository: restic/restic
  tag: "0.19.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

backup:
  # Standard Kubernetes CronJob cron expression (5 fields).
  schedule: "17 2 * * *"
  # CronJob .spec.timeZone requires a Kubernetes version that supports it.
  timeZone: ""
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: null
  activeDeadlineSeconds: null
  backoffLimit: 0

  # Stable Restic hostname. Do not use the CronJob Pod hostname because it changes.
  host: ""
  tags:
    - kubernetes
    - pvc-backup

  # Each path in include/exclude is relative to the root of that PVC.
  # An empty include list means "backup the whole PVC".
  targets: []
  # - name: data
  #   claimName: data
  #   include:
  #     - data/git/repositories
  #     - data/attachments
  #   exclude:
  #     - data/log/**
  #     - data/indexers/**
  #     - tmp/**

  # Additional arguments passed only to `restic backup`.
  extraArgs: []

repository:
  # Recommended: create this Secret separately using ExternalSecret, SOPS,
  # SealedSecret, etc. It should contain RESTIC_REPOSITORY, RESTIC_PASSWORD,
  # and backend-specific environment variables such as AWS_ACCESS_KEY_ID.
  existingSecret: restic-repository

  # Optional convenience mode. Do not commit real credentials to values.yaml.
  createSecret: false
  secretName: ""
  stringData:
    RESTIC_REPOSITORY: ""
    RESTIC_PASSWORD: ""
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""

  # Initialize a missing repository automatically. Other probe errors remain fatal.
  autoInitialize: false

  # Applied to Restic repository operations so the backup CronJob and the
  # independent integrity CronJob can safely overlap for a short time.
  # Restic accepts values such as 5m, 30m, or 2h. Empty disables retrying.
  retryLock: "15m"

retention:
  enabled: true
  prune: true
  groupBy: "host,tags"

  # Empty means "do not pass this option". Strings intentionally support
  # Restic's special value "unlimited".
  keepLast: ""
  keepHourly: ""
  keepDaily: "7"
  keepWeekly: "4"
  keepMonthly: "6"
  keepYearly: "1"

  keepWithin: ""
  keepWithinHourly: ""
  keepWithinDaily: ""
  keepWithinWeekly: ""
  keepWithinMonthly: ""
  keepWithinYearly: ""

  keepTags: []
  extraArgs: []

# Fast repository structure check executed at the end of every backup cycle.
check:
  enabled: true
  readData: false
  readDataSubset: ""
  extraArgs: []

# Independent periodic integrity verification. It does not mount the backup PVCs;
# it only needs access to the Restic repository Secret.
integrityCheck:
  enabled: true
  schedule: "43 4 * * 0"
  timeZone: ""
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: null
  activeDeadlineSeconds: null
  backoffLimit: 0

  # metadata: restic check
  # subset:   restic check --read-data-subset=<readDataSubset>
  # full:     restic check --read-data
  mode: subset
  readDataSubset: "10%"
  withCache: false
  extraArgs: []

cache:
  # Metadata cache for the backup CronJob. emptyDir avoids another node-bound PVC.
  type: emptyDir
  emptyDir: {}
  existingClaim: ""

integrityCache:
  type: emptyDir
  emptyDir: {}
  existingClaim: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 0

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: false

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

integrityResources: {}
integrityNodeSelector: {}
integrityTolerations: []
integrityAffinity: {}

exporter:
  enabled: true
  image:
    repository: ngosang/restic-exporter
    tag: "2.1.2"
    pullPolicy: IfNotPresent
  # Repository scans are relatively expensive for remote object storage.
  refreshInterval: 3600
  logLevel: INFO
  # Daily backup and periodic integrity CronJobs perform checks independently.
  # Set false only if you explicitly also want exporter-driven restic_check_success.
  noCheck: true
  noGlobalStats: false
  noLocks: false
  includePaths: true
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    port: 8001
    annotations: {}
  cache:
    enabled: true
    emptyDir: {}

serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 30s
  additionalLabels: {}
  metricRelabelings: []
  relabelings: []

# PrometheusRule requires Prometheus Operator CRDs and kube-state-metrics for
# CronJob state rules. Enable this in clusters running kube-prometheus-stack.
prometheusRule:
  enabled: false
  additionalLabels: {}
  severity: warning

  # Last successful backup / integrity execution age thresholds.
  staleBackupSeconds: 93600       # 26h
  staleIntegritySeconds: 691200   # 8d

  # Avoid alerting while a normally-running CronJob is still active.
  latestRunFailureFor: 15m
  runningTooLongSeconds: 21600    # 6h
  exporterDownFor: 15m
  repositoryLockFor: 2h

  rules:
    backupLatestRunFailed: true
    backupStale: true
    backupRunningTooLong: true
    integrityLatestRunFailed: true
    integrityStale: true
    integrityRunningTooLong: true
    exporterDown: true
    repositoryLocked: true
    repositoryCheckFailed: false

  additionalRules: []

grafanaDashboard:
  enabled: true
  labels:
    grafana_dashboard: "1"
  annotations: {}
  # The dashboard contains its own Prometheus datasource variable.
  # Empty values generate per-release title/UID to avoid collisions.
  title: ""
  uid: ""
  refresh: "5m"
